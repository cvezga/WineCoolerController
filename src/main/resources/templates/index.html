<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171b19">
    <title>Wine Cooler Controller</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #111513;
            color: #f4f1e9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 56px 20px;
            background: radial-gradient(ellipse at 50% -10%, #34382d 0, #191e1b 42%, #111513 78%);
        }

        main {
            width: min(100%, 760px);
            margin: 0 auto;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: #c2a56c;
            font-size: .75rem;
            font-weight: 700;
            letter-spacing: .17em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3rem);
            letter-spacing: -.045em;
        }

        .intro {
            margin: 10px 0 32px;
            color: #a9b0aa;
            line-height: 1.6;
        }

        .areas {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .area {
            padding: 24px;
            border: 1px solid #353d37;
            border-radius: 18px;
            background: linear-gradient(145deg, rgba(39, 47, 41, .96), rgba(27, 33, 29, .96));
            box-shadow: 0 18px 50px rgba(0, 0, 0, .2);
        }

        .area-heading {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .area-icon {
            display: grid;
            width: 40px;
            height: 40px;
            place-items: center;
            border-radius: 12px;
            background: #373b2c;
            color: #d3b779;
            font-size: 1.2rem;
        }

        h2 {
            margin: 0;
            font-size: 1.1rem;
        }

        .area-note {
            margin: 4px 0 0;
            color: #929b93;
            font-size: .82rem;
        }

        .lcd-view {
            position: relative;
            margin: 16px 0;
            padding: 20px;
            background: url('LCD.png') center/cover no-repeat;
            border-radius: 10px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6);
        }

        .lcd-content {
            position: relative;
            z-index: 1;
            text-align: center;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 1.4rem;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.6);
        }

        .lcd-temperature {
            font-size: 2rem;
            margin-bottom: 4px;
        }

        .lcd-status {
            font-size: 0.9rem;
            color: #00cc00;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        button {
            min-height: 46px;
            padding: 10px 12px;
            border: 1px solid #465148;
            border-radius: 10px;
            background: #252d27;
            color: #e9ece7;
            font: inherit;
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background .16s ease, border-color .16s ease, transform .16s ease;
        }

        button:hover {
            border-color: #b49a65;
            background: #30392f;
            transform: translateY(-1px);
        }

        button:focus-visible {
            outline: 3px solid #d3b779;
            outline-offset: 3px;
        }

        button.primary {
            border-color: #a58c59;
            background: #8e7548;
            color: #fffaf0;
        }

        button.primary:hover {
            border-color: #cdb47b;
            background: #a08756;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #353d37;
        }

        .control-row:last-child {
            border-bottom: none;
        }

        .control-label {
            font-size: .9rem;
            font-weight: 600;
            color: #e9ece7;
        }

        .toggle-slider {
            position: relative;
            width: 52px;
            height: 28px;
            flex-shrink: 0;
        }

        .toggle-slider input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider .slider-track {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #252d27;
            border: 1px solid #465148;
            border-radius: 28px;
            transition: background .2s ease, border-color .2s ease;
        }

        .toggle-slider .slider-track:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 2px;
            bottom: 2px;
            background: #929b93;
            border-radius: 50%;
            transition: transform .2s ease, background .2s ease;
        }

        .toggle-slider input:checked + .slider-track {
            background: #8e7548;
            border-color: #a58c59;
        }

        .toggle-slider input:checked + .slider-track:before {
            transform: translateX(24px);
            background: #fffaf0;
        }

        .toggle-slider input:focus-visible + .slider-track {
            outline: 3px solid #d3b779;
            outline-offset: 3px;
        }

        @media (max-width: 580px) {
            body {
                padding: 36px 16px;
            }

            .areas {
                grid-template-columns: 1fr;
                gap: 14px;
            }

            .area {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<main>
    <header>
        <p class="eyebrow">Climate &amp; lighting</p>
        <h1>Wine Cooler</h1>
        <p class="intro">Control the lights and temperature in each storage area.</p>
    </header>

    <div class="areas">
        <section class="area" aria-labelledby="upper-heading">
            <div class="area-heading">
                <span class="area-icon" aria-hidden="true">↑</span>
                <div>
                    <h2 id="upper-heading">Upper Area</h2>
                    <p class="area-note">Top storage zone</p>
                </div>
            </div>
            <div class="lcd-view">
                <div class="lcd-content">
                    <div class="lcd-temperature">-- °C</div>
                    <div class="lcd-status">Upper Zone</div>
                </div>
            </div>
            <div class="controls">
                <div class="control-row">
                    <span class="control-label">Light</span>
                    <label class="toggle-slider">
                        <input type="checkbox" onchange="window.location.reload()">
                        <span class="slider-track"></span>
                    </label>
                </div>
                <div class="control-row">
                    <span class="control-label">Cooler</span>
                    <label class="toggle-slider">
                        <input type="checkbox" onchange="window.location.reload()">
                        <span class="slider-track"></span>
                    </label>
                </div>
                <div class="control-row">
                    <span class="control-label">Temperature</span>
                    <div style="display:flex;gap:8px;">
                        <button onclick="window.location.reload()">↑</button>
                        <button onclick="window.location.reload()">↓</button>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <div class="areas">
        <section class="area" aria-labelledby="lower-heading">
            <div class="area-heading">
                <span class="area-icon" aria-hidden="true">↓</span>
                <div>
                    <h2 id="lower-heading">Lower Area</h2>
                    <p class="area-note">Bottom storage zone</p>
                </div>
            </div>
            <div class="lcd-view">
                <div class="lcd-content">
                    <div class="lcd-temperature">-- °C</div>
                    <div class="lcd-status">Lower Zone</div>
                </div>
            </div>
            <div class="controls">
                <div class="control-row">
                    <span class="control-label">Light</span>
                    <label class="toggle-slider">
                        <input type="checkbox" onchange="window.location.reload()">
                        <span class="slider-track"></span>
                    </label>
                </div>
                <div class="control-row">
                    <span class="control-label">Cooler</span>
                    <label class="toggle-slider">
                        <input type="checkbox" onchange="window.location.reload()">
                        <span class="slider-track"></span>
                    </label>
                </div>
                <div class="control-row">
                    <span class="control-label">Temperature</span>
                    <div style="display:flex;gap:8px;">
                        <button onclick="window.location.reload()">↑</button>
                        <button onclick="window.location.reload()">↓</button>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
</body>
</html>
